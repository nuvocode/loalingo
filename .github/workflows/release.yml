# Builds macOS (Apple silicon + Intel), Windows and Linux and uploads them with a merged latest.json
# to a draft GitHub release. Push a tag `v<version>` (matching tauri.conf.json), wait for all jobs,
# then publish the draft: the in-app updater only sees published releases.
# Manual runs (workflow_dispatch) just build, as a smoke test, without touching releases.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # One draft before the matrix starts: four jobs looking for it at once made two drafts for v1.5.0.
  release:
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "Sprigo ${TAG#v}" \
            --notes "Downloads for macOS, Windows and Linux. The macOS app is not notarized yet: see the README for the one-time \`xattr\` command."
          echo "id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq "map(select(.tag_name == \"$TAG\" and .draft)) | .[0].id")" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    if: ${{ !cancelled() && needs.release.result != 'failure' }} # manual runs skip `release` and still build
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libdbus-1-dev pkg-config

      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.args }}

      - run: pnpm install --frozen-lockfile
      - name: Whisper model
        shell: bash
        run: pnpm fetch-model

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.release.outputs.id }} # empty on manual runs: build only
          # ponytail: each job merges latest.json as it finishes; two finishing in the same second could drop a platform. Check it before publishing.
          args: ${{ matrix.args }}
