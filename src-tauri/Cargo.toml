[package]
name = "loalingo"
version = "0.1.0"
description = "Local-first AI language learning"
authors = ["nuvocode"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "loalingo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.5.0", features = ["sqlite"] }
tauri-plugin-http = "~2.7"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tauri-plugin-notification = "~2.5"
whisper-rs = { version = "0.16", features = ["metal"] }
tauri-plugin-autostart = "~2.6"
tauri-plugin-opener = "~2.6"
tauri-plugin-updater = "~2.13"
tauri-plugin-process = "~2.4"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Proc macros (sqlx-macros) load as host dylibs; stripping them breaks dlopen with the macOS 27 linker
# ("mis-aligned LINKEDIT string pool"). The app binary is still stripped.
[profile.release.build-override]
strip = false

# whisper.cpp unoptimized is unusably slow; keep it fast in `tauri dev` too.
[profile.dev.package.whisper-rs-sys]
opt-level = 3
