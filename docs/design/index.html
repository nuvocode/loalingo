<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprigo — İngilizce öğren</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* OD-LAYOUT-PRIMITIVES v1 — structure only */
@layer od-layout {
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }
  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-nowrap  { white-space: nowrap; }
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; }
  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }
  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }
  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
/* /OD-LAYOUT-PRIMITIVES v1 */

:root{
  --green:#58cc02; --green-dark:#46a302; --green-bright:#a5ed6e;
  --blue:#1cb0f6; --blue-dark:#1899d6; --sky:#ddf4ff;
  --gold:#ffc800; --gold-dark:#e0a800;
  --red:#ff4b4b; --red-dark:#ea2b2b;
  --purple:#ce82ff; --orange:#ff9600;
  --text:#3c3c3c; --text-muted:#777; --text-faint:#afafaf;
  --border:#e5e5e5; --bg:#fff; --surface:#f7f7f7; --card:#fff;
  --r:12px;
  --sidebar-w:240px; --rail-w:340px; --center-w:640px;
}
html[data-theme="dark"]{
  --bg:#131f24; --surface:#223038; --card:#1e2c33; --text:#eceff1;
  --text-muted:#9fb0b8; --text-faint:#647680;
  --border:#2c3e47; --sky:#173a4a;
}
html[data-theme="dark"] .lesson-footer.ok,
html[data-theme="dark"] .opt.correct{background:#1e3a1e}
html[data-theme="dark"] .lesson-footer.bad,
html[data-theme="dark"] .opt.wrong{background:#3f1d1d}
html[data-theme="dark"] .node.start-tag{color:var(--green-bright)}
html[data-theme="dark"] .word-chip{box-shadow:0 2px 0 var(--border)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Nunito","Segoe UI",system-ui,sans-serif;
  color:var(--text); background:var(--bg);
  font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
h1,h2,h3{line-height:1.25}
svg{display:block}

/* ===== App frame ===== */
.app{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);min-height:100vh}
.sidebar{
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
  border-right:2px solid var(--border);padding:20px 12px;gap:4px;background:var(--card);z-index:20;
}
.logo{padding:6px 12px 18px;font-weight:900;font-size:26px;color:var(--green);letter-spacing:-.5px;user-select:none}
.nav-item{
  display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:var(--r);
  font-weight:800;font-size:14px;letter-spacing:.8px;text-transform:uppercase;color:var(--text-muted);
  text-align:left;width:100%;min-height:44px;
}
.nav-item svg{width:26px;height:26px;flex:none}
.nav-item:hover{background:var(--surface)}
.nav-item.active{color:var(--blue);background:var(--sky)}
.nav-more{margin-top:auto}

.main{min-width:0}
.center{max-width:var(--center-w);margin:0 auto;padding:0 20px 120px}
@media(min-width:1100px){
  .main-inner{display:grid;grid-template-columns:minmax(0,1fr) var(--rail-w);gap:32px;max-width:calc(var(--center-w) + var(--rail-w) + 64px);margin:0 auto;padding:0 20px}
  .center{max-width:none;margin:0;padding:0 0 120px}
  .rail{display:block}
}
.rail{display:none;position:sticky;top:0;height:100vh;overflow-y:auto;padding:20px 0 40px}
.rail-card{border:2px solid var(--border);border-radius:16px;padding:16px;margin-bottom:16px}
.rail-card h3{font-size:15px;font-weight:800;letter-spacing:.5px}

/* top stats (inside rail) */
.stat-strip{display:flex;gap:18px}
.stat-chip{display:flex;align-items:center;gap:6px;font-weight:800;font-size:15px}
.stat-chip svg{width:22px;height:22px}

/* ===== chunky buttons ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-weight:800;font-size:15px;letter-spacing:.8px;text-transform:uppercase;
  padding:12px 20px;border-radius:var(--r);min-height:44px;
  transition:transform .12s ease, filter .2s ease;
}
.btn:active{transform:translateY(2px)}
.btn-primary{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
.btn-primary:hover{filter:brightness(1.05)}
.btn-primary:active{box-shadow:0 2px 0 var(--green-dark)}
.btn-blue{background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue-dark)}
.btn-blue:active{box-shadow:0 2px 0 var(--blue-dark)}
.btn-ghost{background:var(--card);color:var(--blue);border:2px solid var(--border);box-shadow:0 2px 0 var(--border)}
.btn-ghost:hover{background:var(--surface)}
.btn-danger{background:var(--red);color:#fff;box-shadow:0 4px 0 var(--red-dark)}
.btn[disabled]{background:var(--border);color:var(--text-faint);box-shadow:none;cursor:not-allowed;transform:none}
.btn-block{width:100%}

/* ===== Learn path ===== */
.unit-head{
  position:sticky;top:0;z-index:5;
  background:var(--green);color:#fff;border-radius:16px;padding:18px 20px;margin:24px 0 8px;
  box-shadow:0 4px 0 var(--green-dark);
}
.unit-head .uh-kicker{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;opacity:.85}
.unit-head h2{font-size:22px;font-weight:900}
.unit-head .uh-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.unit-head .guidebook{
  display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.18);
  border:2px solid rgba(255,255,255,.35);border-radius:var(--r);padding:8px 14px;
  font-weight:800;font-size:13px;color:#fff;min-height:44px;
}
.unit-head.alt{background:var(--purple);box-shadow:0 4px 0 #a25cd6}
.unit-head.alt2{background:var(--blue);box-shadow:0 4px 0 var(--blue-dark)}

.path{position:relative;display:flex;flex-direction:column;align-items:center;padding:16px 0 32px;gap:22px}
.path-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.path .node{position:relative;z-index:1}
.node{position:relative;display:flex;flex-direction:column;align-items:center}
.node-btn{
  width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18);transition:transform .15s ease;
  border:4px solid var(--bg);outline:4px solid transparent;
}
.node-btn svg{width:28px;height:28px}
.node-btn:hover{transform:scale(1.06)}
.node-btn:active{transform:translateY(2px)}
.node.done .node-btn{background:var(--green)}
.node.done.legendary .node-btn{background:var(--gold)}
.node.current .node-btn{background:var(--green);outline-color:var(--green-bright);animation:pulse 2s infinite}
.node.locked .node-btn{background:var(--border);color:var(--text-faint);cursor:not-allowed;box-shadow:0 5px 0 #d4d4d4}
.node.chest .node-btn{background:var(--purple)}
.node.start-tag{
  position:absolute;top:-30px;background:var(--card);border:2px solid var(--border);border-radius:10px;
  padding:3px 10px;font-size:12px;font-weight:900;color:var(--green);letter-spacing:1px;text-transform:uppercase;
  animation:bob 1.6s ease-in-out infinite;white-space:nowrap;
}
.node-label{font-size:13px;font-weight:800;color:var(--text-muted);margin-top:6px;text-align:center;max-width:110px}
.node.locked .node-label{color:var(--text-faint)}
@keyframes pulse{0%,100%{outline-width:4px}50%{outline-width:8px}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* ===== cards / lists ===== */
.card{border:2px solid var(--border);border-radius:16px;padding:16px;background:var(--card)}
.row-item{
  display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r);width:100%;text-align:left;min-height:44px;
}
.row-item:hover{background:var(--surface)}
.section-title{font-size:19px;font-weight:900;margin:28px 0 12px}
.muted{color:var(--text-muted)}
.small{font-size:13px}
.progress-track{height:14px;background:var(--border);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:var(--gold);border-radius:99px;transition:width .4s ease}
.progress-fill.green{background:var(--green)}

/* quest */
.quest{display:flex;align-items:center;gap:12px;padding:10px 0}
.quest .q-icon{width:40px;height:40px;flex:none;border-radius:10px;background:var(--sky);display:flex;align-items:center;justify-content:center;color:var(--blue)}
.quest .q-body{flex:1;min-width:0}
.quest .q-name{font-weight:800;font-size:14px}
.quest .q-bar{height:10px;background:var(--border);border-radius:99px;margin-top:6px;overflow:hidden}
.quest .q-fill{height:100%;background:var(--gold);border-radius:99px}
.quest .q-count{font-weight:800;font-size:13px;color:var(--text-muted);white-space:nowrap}

/* league */
.league-row{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:var(--r)}
.league-row.me{background:var(--sky);outline:2px solid var(--blue)}
.league-rank{width:28px;font-weight:900;font-size:15px;text-align:center;color:var(--text-muted);flex:none}
.league-rank.top{color:var(--gold-dark)}
.avatar{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:15px}
.league-name{flex:1;min-width:0;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.league-xp{font-weight:800;color:var(--text-muted);white-space:nowrap;font-size:14px}

/* shop */
.shop-item{display:flex;align-items:center;gap:14px;border:2px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px}
.shop-item .s-icon{width:52px;height:52px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center}
.shop-item .s-body{flex:1;min-width:0}
.shop-item h4{font-size:16px;font-weight:900}
.price-tag{display:flex;align-items:center;gap:6px;font-weight:900;color:var(--red);white-space:nowrap}
.price-tag.owned{color:var(--green-dark)}

/* words */
.word-chip{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--border);border-radius:99px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 2px 0 var(--border);background:var(--card)}
.word-chip .strength{width:44px;height:6px;border-radius:99px;background:var(--border);overflow:hidden}
.word-chip .strength i{display:block;height:100%;border-radius:99px}

/* ===== lesson mode ===== */
.lesson-overlay{
  position:fixed;inset:0;background:var(--card);z-index:100;display:none;flex-direction:column;
}
.lesson-overlay.open{display:flex}
.lesson-top{display:flex;align-items:center;gap:16px;padding:16px 20px;max-width:900px;width:100%;margin:0 auto}
.lesson-progress{flex:1;height:14px;background:var(--border);border-radius:99px;overflow:hidden}
.lesson-progress i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .35s ease}
.icon-btn{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:var(--r);color:var(--text-faint)}
.icon-btn:hover{background:var(--surface)}
.hearts-box{display:flex;align-items:center;gap:4px;font-weight:900;color:var(--red);font-size:16px}
.lesson-body{flex:1;overflow-y:auto;display:flex;justify-content:center;padding:20px}
.lesson-inner{width:100%;max-width:600px;display:flex;flex-direction:column}
.ex-title{font-size:24px;font-weight:900;margin-bottom:8px}
.ex-sub{font-size:15px;color:var(--text-muted);margin-bottom:24px}
.prompt-word{
  align-self:flex-start;display:inline-flex;align-items:center;gap:10px;border:2px solid var(--border);
  border-radius:var(--r);padding:12px 16px;font-weight:800;font-size:18px;margin-bottom:24px;box-shadow:0 2px 0 var(--border);
}
.opt-grid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:520px){.opt-grid.two{grid-template-columns:1fr 1fr}}
.opt{
  display:flex;align-items:center;gap:12px;border:2px solid var(--border);border-radius:var(--r);
  padding:14px 16px;font-weight:700;font-size:16px;text-align:left;min-height:52px;background:var(--card);
  box-shadow:0 2px 0 var(--border);transition:border-color .15s ease, background .15s ease;
}
.opt:hover{border-color:var(--blue)}
.opt .opt-num{width:26px;height:26px;flex:none;border:2px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--text-muted)}
.opt.sel{border-color:var(--blue);background:var(--sky)}
.opt.sel .opt-num{border-color:var(--blue);color:var(--blue)}
.opt.correct{border-color:var(--green);background:#e9f9d8}
.opt.correct .opt-num{border-color:var(--green);color:var(--green-dark)}
.opt.wrong{border-color:var(--red);background:#ffe3e3}
.opt.wrong .opt-num{border-color:var(--red);color:var(--red)}
.bank-area{min-height:64px;border-bottom:2px solid var(--border);display:flex;flex-wrap:wrap;gap:8px;padding:10px 0;margin-bottom:24px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:auto;padding:20px 0}
.tok{
  border:2px solid var(--border);border-radius:10px;padding:10px 14px;font-weight:700;font-size:16px;background:var(--card);
  box-shadow:0 2px 0 var(--border);min-height:44px;
}
.tok:active{transform:translateY(1px)}
.tok.used{opacity:.25;pointer-events:none}
.lesson-footer{border-top:2px solid var(--border);padding:16px 20px}
.lesson-footer .foot-inner{max-width:900px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:16px}
.lesson-footer.ok{background:#e9f9d8;border-color:#b8e28a}
.lesson-footer.bad{background:#ffe3e3;border-color:#f5b3b3}
.fb{display:flex;align-items:center;gap:12px;font-weight:900;font-size:17px}
.fb.good{color:var(--green-dark)}
.fb.bad{color:var(--red-dark)}
.fb .fb-ico{width:40px;height:40px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;flex:none}
.fb small{display:block;font-weight:700;font-size:13px;color:var(--text-muted)}
/* result */
.result-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:18px}
.result-badge{width:120px;height:120px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 var(--gold-dark)}
.result-stats{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.result-stat{border:2px solid;border-radius:14px;padding:10px 18px;min-width:110px}
.result-stat .rs-k{font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase}
.result-stat .rs-v{font-size:20px;font-weight:900}
.result-stat.gold{border-color:var(--gold);color:var(--gold-dark)}
.result-stat.green{border-color:var(--green);color:var(--green-dark)}
.result-stat.blue{border-color:var(--blue);color:var(--blue-dark)}
/* chest */
.chest-box{width:140px;height:140px;border-radius:24px;background:var(--purple);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 #a25cd6;cursor:pointer;transition:transform .2s ease}
.chest-box:hover{transform:scale(1.05)}

/* toast */
.toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);
  background:var(--text);color:#fff;font-weight:800;font-size:14px;padding:12px 20px;border-radius:12px;
  opacity:0;pointer-events:none;transition:all .25s ease;z-index:200;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* modal sheet */
.sheet-scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:150;display:none;align-items:center;justify-content:center;padding:20px}
.sheet-scrim.open{display:flex}
.sheet{background:var(--card);border-radius:20px;max-width:420px;width:100%;padding:24px;text-align:center}
.sheet h3{font-size:20px;font-weight:900;margin-bottom:8px}
.sheet p{color:var(--text-muted);margin-bottom:20px}
.sheet .btn{margin:4px 0}

/* mobile */
.bottom-nav{display:none}
@media(max-width:1099px){
  .rail{display:none}
}
@media(max-width:767px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
  .bottom-nav{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-top:2px solid var(--border);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .bottom-nav .nav-item{flex-direction:column;gap:2px;font-size:10px;padding:6px 2px;letter-spacing:.4px;justify-content:center}
  .center{padding-bottom:140px}
  .ex-title{font-size:20px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="Ana gezinme">
    <div class="logo">sprigo</div>
    <nav id="sideNav"></nav>
  </aside>
  <main class="main">
    <div class="main-inner">
      <div class="center" id="screen" tabindex="-1"></div>
      <aside class="rail" id="rail" aria-label="İlerleme"></aside>
    </div>
  </main>
</div>
<nav class="bottom-nav" id="bottomNav" aria-label="Alt gezinme"></nav>

<!-- lesson overlay -->
<div class="lesson-overlay" id="lessonOverlay" role="dialog" aria-modal="true" aria-label="Ders">
  <div class="lesson-top">
    <button class="icon-btn" id="lessonClose" aria-label="Dersi kapat">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="lesson-progress"><i id="lessonBar" style="width:0%"></i></div>
    <div class="hearts-box" id="lessonHearts"></div>
  </div>
  <div class="lesson-body"><div class="lesson-inner" id="lessonBody"></div></div>
  <div class="lesson-footer" id="lessonFooter"></div>
</div>

<div class="sheet-scrim" id="sheetScrim"><div class="sheet" id="sheetBox" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ================= state ================= */
const S = {
  hearts: 5, maxHearts: 5,
  streak: 12, gems: 505, xp: 1240, todayXp: 30,
  league: "Safir", leagueRank: 4,
  streakFreeze: 1,
  currentUnit: 1,
  quests: [
    { id:"q1", name:"30 XP kazan", icon:"bolt", cur:30, goal:50 },
    { id:"q2", name:"3 ders tamamla", icon:"book", cur:1, goal:3 },
    { id:"q3", name:"1 hikâye oku", icon:"story", cur:0, goal:1 },
  ],
  chests: 1,

/* dashed winding connector between lesson nodes */
function drawPathLines(){
  document.querySelectorAll(".path").forEach(path=>{
    path.querySelector("svg.path-lines")?.remove();
    const btns=[...path.querySelectorAll(".node-btn")];
    if(btns.length<2) return;
    const pr=path.getBoundingClientRect();
    const pts=btns.map(b=>{
      const r=b.getBoundingClientRect();
      return [r.left-pr.left+r.width/2, r.top-pr.top+r.height/2];
    });
    let d=`M ${pts[0][0]} ${pts[0][1]}`;
    for(let i=1;i<pts.length;i++){
      const [x0,y0]=pts[i-1], [x1,y1]=pts[i], my=(y0+y1)/2;
      d+=` C ${x0} ${my}, ${x1} ${my}, ${x1} ${y1}`;
    }
    const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
    svg.setAttribute("class","path-lines");
    svg.setAttribute("width",pr.width); svg.setAttribute("height",pr.height);
    svg.setAttribute("viewBox",`0 0 ${pr.width} ${pr.height}`);
    const mk=(w,stroke)=>{const p=document.createElementNS("http://www.w3.org/2000/svg","path");
      p.setAttribute("d",d);p.setAttribute("fill","none");p.setAttribute("stroke",stroke);
      p.setAttribute("stroke-width",w);p.setAttribute("stroke-linecap","round");
      p.setAttribute("stroke-dasharray","1 14");return p;};
    svg.appendChild(mk(6,"#e5e5e5"));
    path.insertBefore(svg,path.firstChild);
  });
}
let pathLineT;
window.addEventListener("resize",()=>{clearTimeout(pathLineT);pathLineT=setTimeout(drawPathLines,150);});

      const done=Math.min(a[3],a[4]), pct=done/a[4]*100;
      return `<div class="card od-row" style="--od-gap:14px">
        <span style="width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--surface);color:${a[5]}">${icon(a[0])}</span>
        <span class="od-field od-fill"><b>${a[1]}</b><span class="muted small">${a[2]}</span>
          <span class="progress-track" style="display:block;height:10px;margin-top:6px"><i class="progress-fill" style="width:${pct}%"></i></span></span>
        <span class="od-nowrap muted small" style="font-weight:800">${done}/${a[4]}</span></div>`;
    }).join("")}
  </div>`;
}

function stories(){
  return `<h1 class="section-title" style="margin-top:24px">Hikâyeler</h1>
  <p class="muted" style="margin-bottom:18px">Kısa diyaloglarla okuduğunu anlama.</p>
  <div class="od-stack" style="--od-gap:12px">
    ${[["Kahve Dükkanında","Barista ile sipariş ver","3 dk",true],["Kayıp Köpek","Komşuna yardım et","4 dk",false],["İlk İş Günü","Yeni ekiple tanış","5 dk",false]].map((s,i)=>`
    <button class="card row-item" ${s[3]?'data-toast="Hikâye açılıyor: diyalog satırı satır ilerler"':'data-toast="Önce Ünite 1\'i bitir"'}>
      <span style="width:48px;height:48px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:12px;background:${s[3]?'var(--sky)':'var(--surface)'};color:${s[3]?'var(--blue)':'var(--text-faint)'}">${icon(s[3]?"story":"lock")}</span>
      <span class="od-field od-fill"><b>${s[0]}</b><span class="muted small">${s[1]} · ${s[2]}</span></span>
      ${s[3]?'<span class="btn btn-ghost" style="pointer-events:none">Oku</span>':''}

  <div class="od-grid" style="--od-cols:1;--od-gap:14px">
    ${[["Lily","Otel resepsiyonisti","Giriş yap ve oda iste","#ce82ff"],["Kai","Restoran şefi","Menüden öneri iste","#1cb0f6"]].map(c=>`
    <div class="card od-row" style="--od-gap:14px">
      <span class="avatar" style="width:56px;height:56px;font-size:22px;background:${c[3]}">${c[0][0]}</span>
      <span class="od-field od-fill"><b>${c[0]}</b><span class="muted small">${c[1]} — ${c[2]}</span></span>
      <span class="od-row" style="--od-gap:8px">
        <button class="btn btn-ghost" data-toast="${c[0]} ile yazılı sohbet başlıyor">Sohbet</button>
        <button class="btn btn-blue" data-toast="Görüntülü arama prototipte simüle edilir">${icon("video")} Ara</button>

function friends(){
  return `<h1 class="section-title" style="margin-top:24px">Arkadaşlar</h1>
  <div class="od-stack" style="--od-gap:12px;margin-top:14px">
    ${FRIENDS.map(f=>`
    <div class="card od-row" style="--od-gap:14px">
      <span class="avatar" style="background:${f.c}">${f.n[0]}</span>
      <span class="od-field od-fill"><b>${f.n}</b><span class="muted small">${f.streak} günlük seri</span></span>
      <span class="od-row" style="--od-gap:4px;color:var(--orange);font-weight:900">${icon("flame")}${f.streak}</span>
      <button class="btn btn-ghost" data-toast="${f.n} düelloya davet edildi">Düello</button>
    </div>`).join("")}
  </div>
  <button class="btn btn-primary btn-block" style="margin-top:18px" data-toast="Davet bağlantısı kopyalandı">Arkadaş davet et</button>`;
}

function notifications(){
  return `<h1 class="section-title" style="margin-top:24px">Bildirimler</h1>
  <div class="od-stack" style="--od-gap:10px;margin-top:14px">
    ${NOTIFS.map(n=>`
    <div class="card od-row-top" style="--od-gap:12px">
      <span style="width:40px;height:40px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:10px;background:var(--surface)">${icon(n.icon)}</span>
      <span class="od-field od-fill"><b>${n.t}</b><span class="muted small">${n.d}</span></span>
      <span class="muted small od-nowrap">${n.time}</span>
    </div>`).join("")}
  </div>`;
}

function settings(){
  const row=(name,desc,on)=>`<div class="card od-row" style="--od-gap:12px">
    <span class="od-field od-fill"><b>${name}</b><span class="muted small">${desc}</span></span>
    <button class="btn ${on?'btn-primary':'btn-ghost'}" data-toggle="${name}" style="min-width:84px">${on?'Açık':'Kapalı'}</button></div>`;
  return `<h1 class="section-title" style="margin-top:24px">Ayarlar</h1>
  <div class="od-stack" style="--od-gap:12px;margin-top:14px">
    ${row("Ses efektleri","Doğru/yanlış geri bildirim sesleri",true)}
    ${row("Konuşma egzersizleri","Mikrofonlu alıştırmalar",true)}
    ${row("Günlük hatırlatma","Her akşam 20:00'de bildirim",true)}
    ${row("Hareket azaltma","Animasyonları en aza indir",false)}
  </div>
  <h2 class="section-title">Kurs</h2>
  <div class="card od-row"><span class="od-field od-fill"><b>İngilizce</b><span class="muted small">Türkçe konuşanlar için</span></span>
    <button class="btn btn-ghost" data-toast="Kurs değiştirme prototip dışı">Değiştir</button></div>
  <h2 class="section-title">Hesap</h2>
  <div class="od-stack" style="--od-gap:12px">
    <button class="btn btn-ghost btn-block" data-toast="Profil düzenleme yakında">Profili düzenle</button>
    <button class="btn btn-danger btn-block" data-toast="Çıkış prototipte devre dışı">Çıkış yap</button>
  </div>`;
}

/* ================= rail ================= */
function renderRail(){
  const pct = Math.min(S.todayXp/50*100,100);
  $("#rail").innerHTML = `
  <div class="rail-card"><div class="stat-strip" style="justify-content:space-between">
    <span class="stat-chip" style="color:var(--orange)">${icon("flame")}${S.streak}</span>
    <span class="stat-chip" style="color:var(--blue)">${icon("gem")}${S.gems}</span>
    <span class="stat-chip" style="color:var(--red)">${icon("heart")}${S.hearts}</span>
  </div></div>
  <div class="rail-card">
    <div class="od-row" style="justify-content:space-between;margin-bottom:6px">
      <h3>Günlük Görevler</h3><span class="small" style="font-weight:800;color:var(--gold-dark)">${Math.round(pct)}%</span>
    </div>
    <div class="progress-track" style="margin-bottom:10px"><div class="progress-fill" style="width:${pct}%"></div></div>
    ${S.quests.map(q=>`<div class="quest">
      <span class="q-icon">${icon(q.icon)}</span>
      <span class="q-body"><span class="q-name">${q.name}</span>
        <span class="q-bar"><i class="q-fill" style="width:${Math.min(q.cur/q.goal*100,100)}%"></i></span></span>
      <span class="q-count od-nowrap">${Math.min(q.cur,q.goal)}/${q.goal}</span></div>`).join("")}
  </div>
  <div class="rail-card">
    <div class="od-row" style="justify-content:space-between;margin-bottom:8px">
      <h3>${S.league} Ligi</h3>
      <button class="small" style="font-weight:800;color:var(--blue)" data-go="league">Tümü</button>
    </div>
    ${[...LEAGUE].sort((a,b)=>b.xp-a.xp).slice(0,5).map((p,i)=>`
      <div class="league-row ${p.me?'me':''}">
        <span class="league-rank ${i<3?'top':''}">${i+1}</span>
        <span class="avatar" style="width:30px;height:30px;font-size:13px;background:${p.c}">${p.n[0]}</span>
        <span class="league-name" style="font-size:14px">${esc(p.n)}</span>
        <span class="league-xp">${p.xp} XP</span></div>`).join("")}
  </div>
  ${S.chests>0?`<div class="rail-card" style="text-align:center">
    <h3 style="margin-bottom:10px">Açılmamış sandığın var</h3>
    <div style="display:flex;justify-content:center"><div class="chest-box" data-open-chest style="width:96px;height:96px;border-radius:18px">${icon("chest")}</div></div>
    <p class="muted small" style="margin-top:10px">Dokunarak aç</p></div>`:""}`;
}

/* ================= toast & sheet ================= */
let toastT;
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2200);
}
function sheet(html){ $("#sheetBox").innerHTML=html; $("#sheetScrim").classList.add("open"); }
function closeSheet(){ $("#sheetScrim").classList.remove("open"); }
/* ================= lesson engine ================= */
const EXERCISES = {
  "1-3":[
    {type:"choice", q:"'Lütfen' İngilizce nasıl denir?", opts:["Please","Thanks","Sorry","Hello"], a:0},
    {type:"bank", q:"Cümleyi çevir: 'Teşekkür ederim'", answer:["Thank","you"], bank:["Thank","very","you","are","much"]},
    {type:"choice", q:"'Goodbye' ne demek?", opts:["Güle güle","Günaydın","İyi geceler","Merhaba"], a:0},
    {type:"bank", q:"Cümleyi kur: 'Good morning'", answer:["Good","morning"], bank:["night","Good","morning","evening"]},
    {type:"choice", q:"Hangisi kibar bir istektir?", opts:["Yes, please","No way","Go away","Stop it"], a:0},
  ],
  "practice-mistakes": MISTAKES.map(m=>({type:"choice", q:m.q, opts:[m.correct, m.yours, "Welcome", "Excuse"], a:0})),
  "practice-speak":[
    {type:"speak", q:"Söyle: 'Good morning, how are you?'"},
    {type:"speak", q:"Söyle: 'Thank you very much'"},
    {type:"speak", q:"Söyle: 'See you tomorrow'"},
  ],
  "practice-listen":[
    {type:"choice", listen:"Hello", q:"Duyduğun kelime hangisi?", opts:["Hello","Yellow","Below","Follow"], a:0},
    {type:"choice", listen:"Water", q:"Duyduğun kelime hangisi?", opts:["Water","Later","Letter","Waiter"], a:0},
    {type:"choice", listen:"Friend", q:"Duyduğun kelime hangisi?", opts:["Friend","Field","Find","Fine"], a:0},
    {type:"choice", listen:"Bread", q:"Duyduğun kelime hangisi?", opts:["Bread","Break","Great","Brand"], a:0},
  ],
};

let L = null; // active lesson
function startLesson(id){
  if(S.hearts<=0){
    sheet(`<h3>Kalbin kalmadı</h3><p>Devam etmek için kalp doldur ya da yarını bekle.</p>
      <button class="btn btn-danger btn-block" data-buy="Kalp doldur" data-price="350">350 elmasla doldur</button>
      <button class="btn btn-ghost btn-block" data-close-sheet>Vazgeç</button>`);
    return;
  }
  const list = EXERCISES[id] || EXERCISES["1-3"];
  L = { id, list, i:0, correct:0, mistakes:0, bankSel:[], sel:null, checked:false, xp:0 };
  $("#lessonOverlay").classList.add("open");
  document.body.style.overflow="hidden";
  renderExercise();
}
function closeLesson(force){
  if(force || L.i>=L.list.length){ endOverlay(); return; }
  sheet(`<h3>Dersi bırak?</h3><p>Bu dersteki ilerlemen kaybolacak.</p>
    <button class="btn btn-danger btn-block" data-quit-lesson>Bırak</button>
    <button class="btn btn-ghost btn-block" data-close-sheet>Devam et</button>`);
}
function endOverlay(){
  $("#lessonOverlay").classList.remove("open");
  document.body.style.overflow="";
  L=null; render();
}
function lessonChrome(){
  $("#lessonBar").style.width = (L.i/L.list.length*100)+"%";
  $("#lessonHearts").innerHTML = `${icon("heart")}${S.hearts}`;
}
function renderExercise(){
  const ex = L.list[L.i]; L.sel=null; L.checked=false; L.bankSel=[];
  lessonChrome();
  let html = "";
  if(ex.type==="choice"){
    html = `<h2 class="ex-title">${esc(ex.q)}</h2>
      ${ex.listen?`<button class="prompt-word" data-say="${ex.listen}">${icon("headphones")} Dinle</button>`:""}
      <div class="opt-grid">${ex.opts.map((o,i)=>`<button class="opt" data-opt="${i}"><span class="opt-num">${i+1}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
  } else if(ex.type==="bank"){
    html = `<h2 class="ex-title">${esc(ex.q)}</h2>
      <div class="bank-area" id="bankArea"></div>
      <div class="bank">${ex.bank.map((w,i)=>`<button class="tok" data-tok="${i}">${esc(w)}</button>`).join("")}</div>`;
  } else if(ex.type==="speak"){
    html = `<h2 class="ex-title">Konuşma</h2><p class="ex-sub">Mikrofon düğmesine bas ve cümleyi söyle.</p>
      <div class="prompt-word">${esc(ex.q.replace(/^Söyle: /,""))}</div>
      <div style="display:flex;justify-content:center;margin:30px 0">
        <button id="micBtn" data-mic style="width:84px;height:84px;border-radius:50%;background:var(--blue);color:#fff;box-shadow:0 5px 0 var(--blue-dark);display:flex;align-items:center;justify-content:center" aria-label="Kaydet">${icon("mic")}</button>
      </div><p class="muted small" id="micStatus" style="text-align:center">Kaydetmek için dokun</p>`;
  }
  $("#lessonBody").innerHTML = html;
  footer("skip");
}
function footer(mode, ok, correctText){
  const f=$("#lessonFooter"); f.className="lesson-footer"+(mode==="fb"?(ok?" ok":" bad"):"");
  const inner=`<div class="foot-inner">`;
  if(mode==="skip"){
    f.innerHTML = inner+`<button class="btn btn-ghost" data-skip>Geç</button>
      <button class="btn btn-primary" data-check id="checkBtn" disabled>Kontrol Et</button></div>`;
  } else if(mode==="fb"){
    const msg = ok ? `<span class="fb good"><span class="fb-ico" style="color:var(--green)">${icon("check")}</span>Doğru!</span>`
      : `<span class="fb bad"><span class="fb-ico" style="color:var(--red)">${icon("x")}</span><span>Yanlış<small>Doğrusu: ${esc(correctText||"")}</small></span></span>`;
    f.innerHTML = inner+msg+`<button class="btn ${ok?'btn-primary':'btn-danger'}" data-next>${L.i+1>=L.list.length?"Bitir":"Devam"}</button></div>`;
  }
}
function checkAnswer(){
  const ex=L.list[L.i]; let ok=false, correctText="";
  if(ex.type==="choice"){ ok = L.sel===ex.a; correctText=ex.opts[ex.a];
    document.querySelectorAll(".opt").forEach((b,i)=>{
      b.classList.add(i===ex.a?"correct":(i===L.sel?"wrong":"")); b.disabled=true;
    });
  } else if(ex.type==="bank"){ ok = L.bankSel.map(i=>ex.bank[i]).join(" ")===ex.answer.join(" "); correctText=ex.answer.join(" ");
  } else if(ex.type==="speak"){ ok = L.micDone===true; correctText="";
  }
  L.checked=true;
  if(ok){ L.correct++; L.xp+=10; }
  else { L.mistakes++; S.hearts=Math.max(0,S.hearts-1); lessonChrome();
    if(S.hearts<=0){ sheet(`<h3>Kalplerin bitti</h3><p>Mağazadan kalp doldurabilir ya da yarın devam edebilirsin.</p>
      <button class="btn btn-danger btn-block" data-buy="Kalp doldur" data-price="350">350 elmasla doldur</button>
      <button class="btn btn-ghost btn-block" data-quit-lesson>Dersi bitir</button>`); }
  }
  footer("fb", ok, correctText);
}
function nextExercise(){
  L.i++;
  if(L.i>=L.list.length){ finishLesson(); return; }
  renderExercise();
}
function finishLesson(){
  const total=L.list.length, acc=Math.round(L.correct/total*100);
  const gems=L.correct*2;
  S.xp+=L.xp; S.todayXp+=L.xp; S.gems+=gems;
  S.quests.forEach(q=>{ if(q.id==="q1")q.cur=Math.min(q.cur+L.xp,999); if(q.id==="q2")q.cur++; });
  if(L.id==="1-3"){
    const u=UNITS[0]; u.lessons[2].state="done"; u.lessons[3].state="current"; u.lessons[3].name="Sayılar";
  }
  $("#lessonBody").innerHTML = `<div class="result-wrap">
    <div class="result-badge" style="color:#fff">${icon("trophy")}</div>
    <h2 style="font-size:26px;font-weight:900">Ders tamamlandı!</h2>
    <div class="result-stats">
      <span class="result-stat gold"><span class="rs-k">Toplam XP</span><span class="rs-v">+${L.xp}</span></span>
      <span class="result-stat green"><span class="rs-k">Doğruluk</span><span class="rs-v">%${acc}</span></span>
      <span class="result-stat blue"><span class="rs-k">Elmas</span><span class="rs-v">+${gems}</span></span>
    </div></div>`;
  $("#lessonBar").style.width="100%";
  const f=$("#lessonFooter"); f.className="lesson-footer";
  f.innerHTML = `<div class="foot-inner"><span></span>
    <button class="btn btn-primary" data-quit-lesson>Son</button></div>`;
}

/* ================= global events ================= */
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-go],[data-toast],[data-start-lesson],[data-review],[data-start-practice],[data-buy],[data-check],[data-next],[data-skip],[data-quit-lesson],[data-close-sheet],[data-opt],[data-tok],[data-mic],[data-say],[data-open-chest],[data-toggle]");
  if(!t) return;
  if(t.dataset.go) go(t.dataset.go);
  else if(t.dataset.toast) toast(t.dataset.toast);
  else if(t.dataset.startLesson) startLesson(t.dataset.startLesson);
  else if(t.dataset.review) startLesson("1-3");
  else if(t.dataset.startPractice) startLesson("practice-"+t.dataset.startPractice);
  else if(t.dataset.toggle){ const on = t.textContent.trim()==="Açık"; t.textContent=on?"Kapalı":"Açık"; t.classList.toggle("btn-primary",!on); t.classList.toggle("btn-ghost",on); }
  else if(t.dataset.buy){
    const price=+t.dataset.price;
    if(S.gems>=price){ S.gems-=price;
      if(t.dataset.buy==="Kalp doldur") S.hearts=S.maxHearts;
      if(t.dataset.buy==="Streak Freeze") S.streakFreeze++;
      closeSheet(); toast("Satın alındı: "+t.dataset.buy); render();
    } else toast("Yeterli elmasın yok");
  }
  else if(t.dataset.openChest){
    S.chests--; S.gems+=50;
    sheet(`<h3>Sandık açıldı!</h3><p>+50 elmas kazandın.</p><button class="btn btn-primary btn-block" data-close-sheet>Harika</button>`); render();
  }
  else if(t.dataset.closeSheet) closeSheet();
  else if(t.dataset.quitLesson){ closeSheet(); endOverlay(); }
  else if(t.dataset.opt!==undefined && L && !L.checked){
    L.sel=+t.dataset.opt;
    document.querySelectorAll(".opt").forEach((b,i)=>b.classList.toggle("sel",i===L.sel));
    $("#checkBtn").disabled=false;
  }
  else if(t.dataset.tok!==undefined && L && !L.checked){
    const i=+t.dataset.tok, ex=L.list[L.i], pos=L.bankSel.indexOf(i);
    if(pos>=0){ L.bankSel.splice(pos,1); t.classList.remove("used"); }
    else { L.bankSel.push(i); t.classList.add("used"); }
    $("#bankArea").innerHTML = L.bankSel.map(j=>`<button class="tok" data-tok="${j}">${esc(ex.bank[j])}</button>`).join("");
    $("#checkBtn").disabled = L.bankSel.length===0;
  }
  else if(t.dataset.mic!==undefined && L){
    const st=$("#micStatus"); st.textContent="Dinleniyor…";
    t.style.background="var(--red)"; t.style.boxShadow="0 5px 0 var(--red-dark)";
    setTimeout(()=>{ L.micDone=true; st.textContent="Kaydedildi — harika telaffuz!"; $("#checkBtn").disabled=false;
      t.style.background="var(--green)"; t.style.boxShadow="0 5px 0 var(--green-dark)"; },1500);
  }
  else if(t.dataset.say) toast("▶ \""+t.dataset.say+"\" çalınıyor");
  else if(t.dataset.check) checkAnswer();
  else if(t.dataset.next) nextExercise();
  else if(t.dataset.skip){ L.i++; L.i>=L.list.length ? finishLesson() : renderExercise(); }
});
$("#lessonClose").addEventListener("click", ()=>closeLesson(false));
$("#sheetScrim").addEventListener("click", e=>{ if(e.target.id==="sheetScrim") closeSheet(); });
document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){ if($("#sheetScrim").classList.contains("open")) closeSheet(); else if(L) closeLesson(false); }
});

/* ================= init ================= */
render();
</script>
</body>
</html>
</script>
