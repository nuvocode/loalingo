              - pattern: "More cities are investing in renewable energy."
            activities:
              - { type: learn, count: 3 }
              - { type: match }
              - { type: fill_blank, count: 2 }
              - { type: listen_select }
          - id: social-issues
            title: Social Issues
            description: Discuss issues affecting society.
            vocabulary: [inequality, poverty, "unemployment rate", homelessness, "raise awareness"]
            grammar:
              - pattern: "The government is trying to raise awareness of homelessness."
            activities:
              - { type: learn, count: 2 }
              - { type: word_select, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: translate }
          - id: possible-solutions
            title: Possible Solutions
            description: Suggest solutions to social and environmental problems.
            vocabulary: [tackle, "address the issue", "raise funds", implement]
            grammar:
              - pattern: "The city plans to tackle traffic congestion by building more bike lanes."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: word_bank }
          - id: discussing-a-global-issue
            title: Discussing a Global Issue
            description: Share your views on an environmental or social issue with someone else.
            vocabulary: [sustainable, inequality, "raise awareness", "take action", "long-term impact"]
            activities:
              - { type: word_bank, count: 2 }
              - { type: translate, count: 2 }
              - type: dialogue
                scenario: environment_discussion
                goal: Discuss a current environmental issue with a friend and suggest possible solutions.

      - id: science-culture-and-arts
        title: Science, Culture & the Arts
        description: Describe trends, explain causes and effects, and talk about art, culture and discoveries.
        icon: 🎨
        steps:
          - id: describing-trends
            title: Describing Trends
            description: Describe rises, falls and trends using appropriate vocabulary.
            vocabulary: [rise, fall, "a sharp increase", "a steady decline", fluctuate, "remain stable"]
            grammar:
              - pattern: "Sales rose sharply after the new product launched."
              - pattern: "The number of users has remained stable this year."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 3 }
              - { type: match }
              - { type: error_correct }
          - id: cause-and-effect
            title: Cause & Effect
            description: Explain how one event leads to another.
            vocabulary: ["lead to", "result in", "give rise to", "be responsible for"]
            grammar:
              - pattern: "Overfishing has led to a sharp decline in fish populations."
              - pattern: "The new policy resulted in lower unemployment."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: translate }
          - id: scientific-discoveries
            title: Scientific Discoveries
            description: Talk about scientific breakthroughs and discoveries.
            vocabulary: [breakthrough, discover, research, "carry out a study", innovative]
            grammar:
              - pattern: "Scientists have discovered a new way to store energy."
            activities:
              - { type: learn, count: 2 }
              - { type: word_select, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: listen_type }
          - id: talking-about-art-and-culture
            title: Art & Culture
            description: Describe works of art, films and cultural events.
            vocabulary: [exhibition, masterpiece, "thought-provoking", "contemporary art", perform]
            grammar:
              - pattern: "The exhibition features some thought-provoking contemporary art."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: translate }
          - id: discussing-a-cultural-event
            title: Discussing a Cultural Event
            description: Talk about a film, exhibition or performance you have seen.
            vocabulary: [review, plot, "stand out", "highly recommend", "worth seeing"]
            activities:
              - { type: word_bank, count: 2 }
              - { type: translate, count: 2 }
              - { type: speak }
              - type: dialogue
                scenario: reviewing_a_cultural_event
                goal: Tell a friend about a film or exhibition you saw recently and give your opinion of it.

    checkpoint:
      title: B2 Checkpoint
      required_score: 80
      activities:
        - { type: word_select, count: 3 }
        - { type: fill_blank, count: 3 }
        - { type: listen_select, count: 3 }
        - { type: translate, count: 3 }
