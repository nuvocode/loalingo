              - { type: word_bank, count: 2 }
              - { type: listen_type }
          - id: agreeing-and-disagreeing
            title: Agreeing & Disagreeing
            vocabulary: [agree, disagree, exactly, "I'm not so sure", "that's true"]
            grammar:
              - pattern: "I completely agree with you."
              - pattern: "I see your point, but I disagree."
