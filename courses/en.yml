              - { type: word_select, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: translate }
          - id: climate-and-sustainability
            title: Climate & Sustainability
            description: Talk about climate policy, carbon and the transition to renewable energy.
            vocabulary: ["carbon footprint", "net zero", "renewable", "fossil fuels", "tipping point", "offset emissions"]
            grammar:
