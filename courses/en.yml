  B1:
    title: Intermediate
    description: >
      Deal with most situations while travelling, describe experiences and events, and give reasons and
      explanations for opinions and plans.

    units:
      - id: life-experiences-deepened
        title: Life Experiences
        description: Talk about experiences in more detail using present perfect and past simple together.
        icon: 🎯
        steps:
          - id: present-perfect-vs-past-simple
            title: Present Perfect vs Past Simple
            description: Choose between finished time and unspecified time.
            vocabulary: [ago, "last year", since, for, already, just]
            grammar:
              - pattern: "I have visited Paris three times."
              - pattern: "I visited Paris in 2019."
              - pattern: "She has lived here for five years."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 3 }
              - { type: error_correct, count: 2 }
              - { type: multiple_choice, count: 2 }
          - id: since-and-for
            title: Since & For
            description: Talk about how long something has continued.
            vocabulary: [since, for, "how long", continue]
            grammar:
              - pattern: "I have worked here since 2018."
              - pattern: "I have worked here for six years."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: listen_type }
          - id: life-achievements
            title: Life Achievements
            description: Talk about important things you have achieved.
            vocabulary: [achievement, accomplish, goal, milestone, proud, succeed]
            grammar:
              - pattern: "I have achieved a lot this year."
              - pattern: "What is your biggest achievement?"
            activities:
              - { type: learn, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: translate, count: 2 }
              - { type: speak }
          - id: sharing-life-stories
            title: Sharing Life Stories
            description: Ask and answer about experiences, mixing present perfect and past simple.
            vocabulary: [experience, journey, decision, "turning point"]
            activities:
              - { type: learn, count: 2 }
              - { type: word_select, count: 2 }
              - { type: sentence_complete, count: 2 }
              - type: dialogue
                scenario: catching_up_with_old_friend
                goal: Catch up with an old friend about what you have both done and ask for details about specific events.

      - id: telling-stories
        title: Telling Stories
        description: Use past perfect and narrative language to tell longer stories.
        icon: 📖
        steps:
          - id: past-perfect-form
            title: Past Perfect
            description: Talk about an earlier past action.
            vocabulary: ["had already", "had never", "by the time"]
            grammar:
              - pattern: "I had already left when she arrived."
              - pattern: "She had never seen snow before that day."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 3 }
              - { type: match }
              - { type: error_correct }
          - id: past-perfect-vs-past-simple
            title: Past Perfect vs Past Simple
            description: Show which action happened first.
            grammar:
              - pattern: "When I arrived, the film had already started."
              - pattern: "After she had finished, she went home."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: listen_type }
          - id: narrative-linking-words
            title: Linking a Story
            description: Connect events in a story clearly.
            vocabulary: [meanwhile, eventually, "as soon as", however, "in the end"]
            activities:
              - { type: learn, count: 2 }
              - { type: word_select, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: listen_select }
          - id: describing-a-past-experience
            title: Describing a Past Experience
            description: Tell a longer story about something that happened to you.
            vocabulary: [incident, unexpected, memorable, reaction]
            grammar:
              - pattern: "It was raining when the accident happened."
            activities:
              - { type: learn, count: 2 }
              - { type: translate, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: speak }
          - id: telling-an-anecdote
            title: Telling an Anecdote
            description: Share a short personal story with a partner.
            vocabulary: [anecdote, "believe it or not", "guess what"]
            activities:
              - { type: word_bank, count: 2 }
              - { type: error_correct, count: 2 }
              - type: dialogue
                scenario: sharing_an_anecdote
                goal: Tell a colleague a short, surprising story about something that happened to you and react to theirs.

      - id: opinions-and-agreement
        title: Opinions
        description: Give opinions, agree, disagree and give reasons.
        icon: 💬
        steps:
          - id: giving-opinions
            title: Giving Your Opinion
            vocabulary: ["in my opinion", believe, think, "I'd say", personally]
            grammar:
              - pattern: "In my opinion, this is the best option."
              - pattern: "I think we should wait."
            activities:
