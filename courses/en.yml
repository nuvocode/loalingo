              - { type: error_correct, count: 2 }
              - { type: translate }
          - id: community-action
            title: Community Action
            description: Persuade others to take part in a local or global cause.
            vocabulary: [campaign, "raise funds", volunteer, "make a difference", "lobby", "spread the word"]
            activities:
              - { type: word_bank, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: speak }
              - type: dialogue
                scenario: rallying_support
                goal: Persuade a neighbour to join a local campaign, explaining the problem, the plan and why their help matters.

      - id: idioms-and-collocations
        title: Idioms & Collocations
        description: Sound natural with fixed phrases and word partnerships.
        icon: 💬
        steps:
          - id: strong-collocations
            title: Strong Collocations
            description: Pair verbs, nouns and adjectives the way native speakers do.
            vocabulary: ["draw a conclusion", "raise concerns", "wield influence", "harbour doubts", "bitterly disappointed", "deeply rooted"]
            grammar:
              - pattern: "The report raises serious concerns about safety standards."
            activities:
              - { type: learn, count: 2 }
              - { type: match, count: 2 }
              - { type: fill_blank, count: 3 }
              - { type: word_select }
          - id: idioms-of-work-and-money
            title: Idioms of Work & Money
            description: Use idioms about effort, risk, cost and success.
            vocabulary: ["pull your weight", "cut corners", "a drop in the ocean", "break the bank", "go the extra mile", "on a shoestring"]
            activities:
              - { type: learn, count: 2 }
              - { type: match }
              - { type: sentence_complete, count: 2 }
              - { type: translate, count: 2 }
          - id: idioms-of-people-and-feelings
            title: Idioms of People & Feelings
            description: Describe character, mood and relationships with idioms.
            vocabulary: ["down to earth", "on cloud nine", "at the end of my tether", "get cold feet", "wear your heart on your sleeve"]
            activities:
              - { type: learn, count: 2 }
              - { type: word_select, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct }
          - id: phrasal-verbs-advanced
            title: Advanced Phrasal Verbs
            description: Master less common, sometimes idiomatic phrasal verbs.
            vocabulary: ["come across as", "pan out", "chip in", "brush up on", "iron out", "back out of", "fall through"]
            grammar:
              - pattern: "Let's iron out the remaining details before the launch."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 3 }
              - { type: sentence_complete, count: 2 }
              - { type: word_bank }
          - id: telling-a-story-with-idioms
            title: A Story With Idioms
            description: Tell an anecdote and colour it with idioms and collocations.
            vocabulary: ["out of the blue", "by the skin of my teeth", "a blessing in disguise", "the last straw", "in the nick of time"]
            activities:
              - { type: word_bank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: speak }
              - type: dialogue
                scenario: telling_an_anecdote_with_idioms
                goal: Tell a friend about a day when everything went wrong, using at least four idioms naturally.

      - id: argument-and-academic-writing
        title: Argument & Academic Writing
        description: Build a case in formal writing and speech.
        icon: ✍️
        steps:
          - id: structuring-an-essay
            title: Structuring an Essay
            description: Write introductions, thesis statements and topic sentences.
            vocabulary: ["thesis statement", "this essay will argue", "topic sentence", "by way of illustration", "in conclusion"]
            grammar:
              - pattern: "This essay will argue that public transport deserves greater investment."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 3 }
              - { type: word_select, count: 2 }
              - { type: translate }
          - id: evidence-and-citation
            title: Evidence & Citation
            description: Refer to sources and data accurately and fairly.
            vocabulary: ["according to", "as cited in", "corroborate", "in line with", "contradict", "draw on"]
            grammar:
              - pattern: "These findings corroborate earlier research by Chen (2019)."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 3 }
              - { type: match }
              - { type: error_correct }
          - id: counterarguments
            title: Counterarguments
            description: Acknowledge opposing views and rebut them.
            vocabulary: ["critics contend", "a common objection", "refute", "on closer inspection", "this overlooks"]
            grammar:
              - pattern: "Critics contend that the tax is unfair; however, this overlooks its long-term benefits."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 3 }
              - { type: word_bank, count: 2 }
              - { type: translate }
          - id: presenting-a-case-aloud
            title: Presenting a Case
            description: Deliver a structured, persuasive mini-presentation and answer questions.
            vocabulary: ["I'd like to begin by", "turning to", "the key takeaway", "in a nutshell", "I'd be happy to expand"]
