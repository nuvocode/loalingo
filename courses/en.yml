              - { type: sentence_complete, count: 2 }
              - { type: listen_select, count: 2 }
              - { type: word_bank }
          - id: politics-and-governance
            title: Politics & Governance
            description: Discuss how societies are governed and how policy is made.
            vocabulary: [legislation, "grassroots", electorate, "public consultation", "cast a vote", "hold to account"]
            grammar:
