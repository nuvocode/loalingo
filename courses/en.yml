      - id: debate-and-persuasion
        title: Debate & Persuasion
        description: Hedge, concede points and build a persuasive argument.
        icon: ⚖️
        steps:
          - id: hedging-language
            title: Hedging Your Opinion
            description: Soften opinions so they sound less direct.
            vocabulary: ["it could be argued that", "to some extent", arguably, "tend to"]
            grammar:
              - pattern: "It could be argued that remote work reduces productivity."
              - pattern: "To some extent, I agree with you."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 3 }
              - { type: match }
              - { type: error_correct }
          - id: conceding-a-point
            title: Conceding a Point
            description: Accept part of the other side's argument before disagreeing.
            vocabulary: ["I take your point, but", admittedly, granted, "having said that"]
            grammar:
              - pattern: "Admittedly, the plan has some risks, but it's worth trying."
              - pattern: "Having said that, we still need more evidence."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: translate }
          - id: persuasive-language
            title: Persuasive Language
            description: Use language that persuades and convinces.
            vocabulary: [convince, persuade, surely, "there's no doubt that", compelling]
            grammar:
              - pattern: "Surely you can see the benefits of this plan."
              - pattern: "There's no doubt that we need to act now."
            activities:
              - { type: learn, count: 2 }
              - { type: word_select, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: error_correct }
          - id: having-a-debate
            title: Having a Debate
            description: Take part in a structured debate on an everyday issue.
            activities:
              - { type: sentence_complete, count: 2 }
              - { type: translate, count: 2 }
              - { type: speak }
              - type: dialogue
                scenario: friendly_debate
                goal: Debate an everyday issue with a friend, hedging your opinion and conceding at least one point.

